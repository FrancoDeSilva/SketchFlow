<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SketchFlow — Rooms</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: Inter, system-ui, sans-serif;

      /* Background image */
      background-image: url("./src/background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      color: #171923;

      display: flex;
      justify-content: center;

      /* padding: 30px 20px; */
    }

    .wrap {
      width: min(760px, 100%);
    }

    /* Logo */
    .logo {
      display: block;
      width: 60%;
      max-width: 80%;
      height: 40%;
      margin: 0 auto 10px;
      filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.25));
      padding-bottom: 10px;
    }

    /* Main white content area */
    .content {
      background: rgba(255, 255, 255, 0.96);

      border-radius: 20px;

      padding: 30px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.25);

      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 8px;

      font-size: 32px;
      font-weight: 750;
    }

    .sub {
      color: #697386;

      margin: 0 0 28px;
    }

    /* Create room section */
    .create {
      display: flex;
      gap: 10px;

      margin-bottom: 28px;
    }

    input {
      flex: 1;

      padding: 14px 16px;

      border: 1px solid #d9deea;
      border-radius: 10px;

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: #4f7cff;

      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
    }

    button {
      border: 0;
      border-radius: 10px;

      padding: 12px 18px;

      background: linear-gradient(135deg,
          #2563eb,
          #6366f1);

      color: white;

      font-weight: 600;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);

      box-shadow:
        0 6px 15px rgba(37, 99, 235, 0.3);
    }

    /* Room cards */
    .card {
      background: white;

      border: 1px solid #e4e7ef;
      border-radius: 14px;

      padding: 18px;

      margin: 10px 0;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .meta small {
      color: #7a8292;
    }

    .empty {
      color: #7a8292;

      padding: 20px;

      text-align: center;

      border: 1px dashed #d9deea;

      border-radius: 12px;

      background: #fafbff;
    }

    .error {
      color: #c62828;

      margin: 8px 0;
    }

    /* Mobile */
    @media (max-width: 600px) {

      body {
        padding: 30px 15px;
      }

      .content {
        padding: 22px;
      }

      .logo {
        width: 220px;
      }

      .create {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>


<body>

  <main class="wrap">

    <img src="./src/new logo.png" class="logo" alt="SketchFlow Logo">


    <!-- White content area -->
    <section class="content">

      <h1>Welcome to SketchFlow</h1>

      <div class="sub">
        Create a room or join someone else's whiteboard.
      </div>


      <!-- Create Room -->
      <div class="create">

        <input id="room_name" placeholder="Enter room name" maxlength="60" autocomplete="off">

        <button id="create_btn">
          Create room
        </button>

      </div>


      <!-- Error -->
      <div id="error" class="error">
      </div>


      <!-- Available Rooms -->
      <h2>
        Available rooms
      </h2>

      <div id="rooms">

        <div class="empty">
          Loading rooms…
        </div>

      </div>

    </section>

  </main>


  <script type="module" src="/src/rooms.ts">
  </script>

</body>

</html>
